name: Deploy to self-hosted Docker host

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env from secrets and variables
        shell: bash
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || vars.POSTGRES_PASSWORD || 'password' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || vars.POSTGRES_DB || 'groceries' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL || '' }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT || vars.BACKEND_PORT || '4000' }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT || vars.FRONTEND_PORT || '3000' }}
          ADMINER_PORT: ${{ secrets.ADMINER_PORT || vars.ADMINER_PORT || '8081' }}
          DB_PORT: ${{ secrets.DB_PORT || vars.DB_PORT || '5432' }}
          # false unless the site is served over HTTPS to the browser
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE || 'false' }}
          # Unique per deploy: Actions run number + short commit SHA (shown on home screen)
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          VITE_APP_VERSION="${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          # No leading whitespace on keys — Compose would ignore or misread them.
          {
            echo "BACKEND_PORT=${BACKEND_PORT}"
            echo "FRONTEND_PORT=${FRONTEND_PORT}"
            echo "ADMINER_PORT=${ADMINER_PORT}"
            echo "DB_PORT=${DB_PORT}"
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "COOKIE_SECURE=${COOKIE_SECURE}"
            echo "VITE_APP_VERSION=${VITE_APP_VERSION}"
            if [ -n "${DATABASE_URL}" ]; then
              echo "DATABASE_URL=${DATABASE_URL}"
            else
              echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
            fi
          } > .env

          echo "Wrote .env (secrets redacted):"
          sed -E 's/(PASSWORD|DATABASE_URL)=.*/\1=***/' .env
          echo "Frontend version for this deploy: ${VITE_APP_VERSION}"

      - name: Build and deploy containers
        shell: bash
        run: |
          set -euo pipefail
          docker compose down || true
          docker compose up -d --build
          docker compose ps
          docker compose logs backend --tail 50 || true
          docker compose logs frontend --tail 50 || true
